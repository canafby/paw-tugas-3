<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Pendaftaran</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Pendaftaran Peserta</h1>
    <p>Silakan lengkapi data diri Anda dengan benar</p>
  </header>

  <main class="container">
    <div class="box">
      <h2>Form Pendaftaran</h2>

      <form action="detail.html" method="GET">
        <div class="form-group">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
        </div>

        <div class="form-group">
          <label for="nim">NIM</label>
          <input type="text" id="nim" name="nim" placeholder="Contoh: 124140153" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="nama@student.itera.ac.id" required>
        </div>

        <div class="form-group">
          <label for="prodi">Program Studi</label>
          <select id="prodi" name="prodi">
            <option value="Teknik Informatika">Teknik Informatika</option>
            <option value="Sistem Informasi">Teknik Mesin</option>
            <option value="Teknik Elektro">Teknik Elektro</option>
            <option value="Sains Data">Sains Data</option>
          </select>
        </div>

        <div class="form-group">
          <span class="label">Jenis Kelamin</span>
          <label class="inline"><input type="radio" name="jenis_kelamin" value="Laki-laki" checked> Laki-laki</label>
          <label class="inline"><input type="radio" name="jenis_kelamin" value="Perempuan"> Perempuan</label>
        </div>

        <div class="form-group">
          <label for="alamat">Alamat</label>
          <textarea id="alamat" name="alamat" rows="3" placeholder="Masukkan alamat"></textarea>
        </div>

        <button type="submit" class="btn">Daftar</button>
        <button type="reset" class="btn btn-secondary">Reset</button>
      </form>
    </div>
  </main>

  <footer class="footer">Pemrograman Aplikasi Web &copy; 2026</footer>
</body>
</html>
